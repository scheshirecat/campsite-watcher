name: Keep alive

on:
  schedule:
    - cron: "17 16 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "campsite-watcher"
          git config user.email "campsite-watcher@users.noreply.github.com"
          git add .keepalive
          git commit -m "Keep scheduled checks active" || exit 0
          git push
