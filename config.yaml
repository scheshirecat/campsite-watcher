# ---------------------------------------------------------------
#  CAMPSITE WATCHER SETTINGS — this is the only file you need to edit
# ---------------------------------------------------------------

# EVERY WEEK: watch these nights of the week, rolling forward automatically.
#   nights:          which nights you'd stay (monday ... sunday)
#   months_ahead:    how far ahead to look (6 = the next 6 months)
#   nights_per_stay: how many nights in a row, starting that night (usually 1)
# Delete this whole section if you only want specific dates.
every_week:
  nights: [saturday, sunday]
  months_ahead: 6
  nights_per_stay: 1

# SPECIFIC TRIPS (optional): extra dates to watch, on top of the weekly ones.
#   check_in: the date you arrive (YYYY-MM-DD)
#   nights:   how many nights you want to stay
# Example:
#   trips:
#     - check_in: 2027-04-09
#       nights: 2
trips: []

# CAMPGROUNDS: set any of these to false to stop watching it.
campgrounds:
  kirk_creek: true              # Recreation.gov, Big Sur
  kirby_cove: true              # Recreation.gov, Marin Headlands
  steep_ravine_campsites: true  # ReserveCalifornia, Mt. Tamalpais (tent sites)
  steep_ravine_cabins: true     # ReserveCalifornia, Mt. Tamalpais (cabins)
